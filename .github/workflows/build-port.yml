name: Build FNF HTML5 Standalone

on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: "Direct download URL to your mod .zip file"
        required: true
        type: string

      engine_repo:
        description: "Engine repository to build"
        required: false
        default: "ShadowMario/FNF-PsychEngine"
        type: string

      engine_ref:
        description: "Engine branch/tag"
        required: false
        default: "main"
        type: string

      output_file:
        description: "Standalone HTML filename to commit to repository root"
        required: false
        default: "index.html"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      OUTPUT_FILE: ${{ inputs.output_file || 'index.html' }}
      MAX_INLINE_FILE_MB: "25"
      MAX_TOTAL_MB: "90"

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: host-repo

      - name: Checkout engine source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.engine_repo }}
          ref: ${{ inputs.engine_ref }}
          path: engine-source

      - name: Install system dependencies
        run: |
          set -eu

          sudo apt-get update
          sudo apt-get install -y curl wget unzip zip file python3 python3-pip sed

          python3 -m pip install --quiet gdown \
            || python3 -m pip install --quiet --break-system-packages gdown \
            || python3 -m pip install --quiet --user --break-system-packages gdown

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download mod payload
        env:
          MOD_URL: ${{ inputs.mod_url }}
        run: |
          set -eu

          URL="$MOD_URL"
          echo "::add-mask::$URL"

          if [[ "$URL" == *"drive.google.com"* ]]; then
            echo "Downloading from Google Drive with gdown..."
            gdown "$URL" -O mod.zip || gdown --fuzzy "$URL" -O mod.zip
          else
            FIXED_URL="$URL"

            if [[ "$FIXED_URL" == *"dropbox.com"* ]]; then
              FIXED_URL=$(echo "$FIXED_URL" | sed -e 's/dl=0/dl=1/' -e 's/www\.dropbox\.com/dl.dropboxusercontent.com/')
            fi

            echo "Downloading direct zip..."
            curl -L --fail --retry 3 --retry-delay 2 -o mod.zip "$FIXED_URL"
          fi

          file mod.zip || true

          if ! unzip -tq mod.zip >/dev/null 2>&1; then
            echo "::error::Downloaded file is not a valid zip archive."
            exit 1
          fi

      - name: Extract and normalize mod payload
        run: |
          set -eu

          mkdir -p payload_raw payload
          unzip -q mod.zip -d payload_raw

          rm -rf payload_raw/__MACOSX || true

          shopt -s dotglob nullglob
          entries=(payload_raw/*)

          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            echo "Flattening single folder: ${entries[0]}"
            mv "${entries[0]}"/* payload/ 2>/dev/null || true
            mv "${entries[0]}"/.[!.]* payload/ 2>/dev/null || true
          else
            mv payload_raw/* payload/ 2>/dev/null || true
          fi

          rm -rf payload/__MACOSX payload/.git payload/.github || true

          echo "Payload preview:"
          find payload -maxdepth 2 -print > payload-preview.txt 2>/dev/null || true
          sed -n '1,80p' payload-preview.txt || true
          rm -f payload-preview.txt || true

      - name: Inject mod into engine
        run: |
          set -eu

          cd engine-source
          mkdir -p mods assets

          shopt -s dotglob nullglob

          if [ -d ../payload/mods ]; then
            echo "Injecting payload/mods..."
            cp -rn ../payload/mods/. mods/ || true
            cp -rn ../payload/mods/. assets/ || true
          fi

          if [ -d ../payload/assets ]; then
            echo "Injecting payload/assets..."
            cp -rn ../payload/assets/. assets/ || true
            cp -rn ../payload/assets/. mods/ || true
          fi

          for item in ../payload/*; do
            base="$(basename "$item")"

            if [ "$base" = "mods" ] || [ "$base" = "assets" ]; then
              continue
            fi

            echo "Injecting extra payload item: $base"
            cp -rn "$item" mods/ || true
            cp -rn "$item" assets/ || true
          done

          echo "Injected payload preview:"
          find mods -maxdepth 2 -print > mods-preview.txt 2>/dev/null || true
          find assets -maxdepth 2 -print > assets-preview.txt 2>/dev/null || true
          sed -n '1,40p' mods-preview.txt || true
          sed -n '1,40p' assets-preview.txt || true
          rm -f mods-preview.txt assets-preview.txt || true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.2.5"

      - name: Install Haxelibs
        run: |
          set -eu

          cd engine-source

          haxelib setup ~/haxelib
          haxelib install hmm --always --quiet

          haxelib run hmm install --quiet || true

          haxelib list > haxelib-list.txt 2>/dev/null || true

          for lib in lime openfl flixel flixel-addons flixel-ui flixel-tools hscript hxcpp; do
            if ! grep -q "^$lib:" haxelib-list.txt 2>/dev/null; then
              echo "Installing fallback lib: $lib"
              haxelib install "$lib" --always --quiet || true
            fi
          done

          rm -f haxelib-list.txt || true
          haxelib list

      - name: Patch engine for HTML5/web build
        run: |
          set -eu

          cd engine-source

          mkdir -p source/webmock
          mkdir -p source/hxdiscord_rpc

          cat > source/webmock/FileSystem.hx <<'HX'
          package webmock;

          class FileSystem
          {
            public static function absolutePath(path:String):String
            {
              return path;
            }

            public static function exists(path:String):Bool
            {
              return false;
            }

            public static function readDirectory(path:String):Array<String>
            {
              return [];
            }

            public static function isDirectory(path:String):Bool
            {
              return false;
            }

            public static function stat(path:String):Dynamic
            {
              return null;
            }

            public static function fullPath(path:String):String
            {
              return path;
            }

            public static function createDirectory(path:String):Void
            {
            }

            public static function deleteFile(path:String):Void
            {
            }

            public static function deleteDirectory(path:String):Void
            {
            }
          }
          HX

          cat > source/webmock/File.hx <<'HX'
          package webmock;

          import haxe.io.Bytes;

          class File
          {
            public static function getContent(path:String):String
            {
              return "";
            }

            public static function getBytes(path:String):Bytes
            {
              return null;
            }

            public static function saveContent(path:String, content:String):Void
            {
            }

            public static function saveBytes(path:String, bytes:Bytes):Void
            {
            }

            public static function copy(source:String, destination:String):Void
            {
            }
          }
          HX

          cat > source/webmock/Sys.hx <<'HX'
          package webmock;

          class Sys
          {
            public static function exit(code:Int):Void
            {
            }

            public static function sleep(t:Float):Void
            {
            }

            public static function command(cmd:String, ?args:Array<String>):Int
            {
              return 0;
            }

            public static function args():Array<String>
            {
              return [];
            }

            public static function getCwd():String
            {
              return "";
            }

            public static function setCwd(cwd:String):Void
            {
            }

            public static function print(v:Dynamic):Void
            {
            }

            public static function println(v:Dynamic):Void
            {
